name: Build and Publish Custom Docker Image

on:
  push:
    branches:
      - feat-custom-ui
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify official base and resolve build version
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          tag="$(tr -d '\r\n' < .github/custom-upstream-version)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an official stable release tag in .github/custom-upstream-version"
            exit 1
          fi
          git fetch --no-tags https://github.com/Wei-Shaw/sub2api.git "refs/tags/${tag}"
          git merge-base --is-ancestor FETCH_HEAD HEAD
          printf 'version=%s\n' "${tag#v}" >> "$GITHUB_OUTPUT"
          printf 'date=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/feat-custom-ui' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.upstream.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.upstream.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.upstream.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
